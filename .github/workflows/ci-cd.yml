name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || github.repository_owner }}
  HELM_VALUES_FILE: 3-kubernetes/helm/values.yaml
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test
          SECRET_KEY: test-secret-key
        run: pytest tests/ -v

  build-and-scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Resolve Docker image namespace
        shell: bash
        run: |
          namespace="${DOCKER_USERNAME,,}"
          if [ -z "$namespace" ]; then
            namespace="${GITHUB_REPOSITORY_OWNER,,}"
          fi
          echo "IMAGE_NAMESPACE=${namespace}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${namespace}/ecommerce-presentation" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=${namespace}/ecommerce-application" >> "$GITHUB_ENV"

      - name: Build Frontend Image
        run: docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -f 1-apps/frontend/Dockerfile 1-apps/frontend/

      - name: Build Backend Image
        run: docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} -f 1-apps/backend/Dockerfile 1-apps/backend/

      - name: Run Trivy Vulnerability Scanner (Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.FRONTEND_IMAGE }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner (Backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.BACKEND_IMAGE }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Images
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ env.FRONTEND_IMAGE }}:latest
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ${{ env.BACKEND_IMAGE }}:latest
          
          docker push ${{ env.FRONTEND_IMAGE }}:latest
          docker push ${{ env.BACKEND_IMAGE }}:latest

  update-helm-chart:
    name: Update Helm Values (GitOps)
    needs: build-and-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Image Tag in values.yaml
        run: |
          sed -i "s|tag: .*|tag: \"${{ github.sha }}\"|g" ${{ env.HELM_VALUES_FILE }}
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.HELM_VALUES_FILE }}
          git commit -m "🚀 GitOps: Update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin main
