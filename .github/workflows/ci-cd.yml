name: CI/CD Pipeline

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || github.repository_owner }}
  HELM_VALUES_FILE: 3-kubernetes/helm/values.yaml
  KUBERNETES_LAB_FILE: kubernetes-lab.yaml
  FRONTEND_IMAGE: ${{ github.repository_owner }}/ecommerce-presentation
  BACKEND_IMAGE: ${{ github.repository_owner }}/ecommerce-application

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate SonarCloud configuration
        shell: bash
        run: |
          if [ -z "${{ vars.SONAR_PROJECT_KEY }}" ]; then
            echo "SONAR_PROJECT_KEY repository variable is not set."
            exit 1
          fi

          if [ -z "${{ vars.SONAR_ORGANIZATION }}" ]; then
            echo "SONAR_ORGANIZATION repository variable is not set."
            exit 1
          fi

      - name: Cache SonarCloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          skipSignatureVerification: false
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

  build-and-scan:
    name: Build & Security Scan
    needs: sonarcloud
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Resolve Docker image namespace
        shell: bash
        run: |
          namespace="${DOCKER_USERNAME,,}"
          if [ -z "$namespace" ]; then
            namespace="${GITHUB_REPOSITORY_OWNER,,}"
          fi
          echo "IMAGE_NAMESPACE=${namespace}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${namespace}/ecommerce-presentation" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=${namespace}/ecommerce-application" >> "$GITHUB_ENV"

      - name: Build Frontend Image
        run: docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -f 1-apps/frontend/Dockerfile 1-apps/frontend/

      - name: Build Backend Image
        run: docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} -f 1-apps/backend/Dockerfile 1-apps/backend/

      - name: Run Trivy Vulnerability Scanner (Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.FRONTEND_IMAGE }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner (Backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.BACKEND_IMAGE }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Images
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ env.FRONTEND_IMAGE }}:latest
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ${{ env.BACKEND_IMAGE }}:latest
          
          docker push ${{ env.FRONTEND_IMAGE }}:latest
          docker push ${{ env.BACKEND_IMAGE }}:latest

  update-helm-chart:
    name: Update Helm Values (GitOps)
    needs: build-and-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.UPDATE_TOKEN }}

      - name: Update deployment image references
        run: |
          python - <<'PY'
          from pathlib import Path

          values_file = Path("3-kubernetes/helm/values.yaml")
          manifest_file = Path("kubernetes-lab.yaml")
          image_tag = "${{ github.sha }}"
          content = values_file.read_text(encoding="utf-8")
          lines = content.splitlines()

          current_section = None
          in_image_block = False

          for index, line in enumerate(lines):
              stripped = line.strip()

              if stripped == "flask:" and line.startswith("  "):
                  current_section = "flask"
                  in_image_block = False
                  continue

              if stripped == "nginx:" and line.startswith("  "):
                  current_section = "nginx"
                  in_image_block = False
                  continue

              if current_section and stripped == "image:" and line.startswith("    "):
                  in_image_block = True
                  continue

              if in_image_block and stripped.startswith("tag:"):
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[index] = f'{indent}tag: "${{ github.sha }}"'
                  in_image_block = False
                  continue

              if current_section and stripped and not line.startswith("    "):
                  current_section = None
                  in_image_block = False

          values_file.write_text("\n".join(lines) + "\n", encoding="utf-8")

          manifest_content = manifest_file.read_text(encoding="utf-8")
          replacements = {
              "privatergistry/ecommerce-application:": f"privatergistry/ecommerce-application:{image_tag}",
              "privatergistry/ecommerce-presentation:": f"privatergistry/ecommerce-presentation:{image_tag}",
          }

          manifest_lines = []
          for line in manifest_content.splitlines():
              updated_line = line
              stripped = line.strip()
              if stripped.startswith("image: "):
                  for prefix, replacement in replacements.items():
                      if prefix in stripped:
                          indent = line[: len(line) - len(line.lstrip())]
                          updated_line = f"{indent}image: {replacement}"
                          break
              manifest_lines.append(updated_line)

          manifest_file.write_text("\n".join(manifest_lines) + "\n", encoding="utf-8")
          PY
          
      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.HELM_VALUES_FILE }} ${{ env.KUBERNETES_LAB_FILE }}
          git diff --cached --quiet && exit 0
          git commit -m "🚀 GitOps: Update image tag to ${{ github.sha }} [skip ci]"
          git push origin HEAD:main
